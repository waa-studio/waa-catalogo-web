<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WAA Studio — portfolio de museos, experiencias inmersivas, mapping y contenido audiovisual." />
    <title>WAA.STUDIO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/globals.css" />
  </head>

  <body>
    <a class="skip-link" href="#content">Saltar al contenido</a>
    <span id="top"></span>

    <!-- HEADER: logo propio desde assets/ + redes -->
    <header class="header">
      <a class="logo" href="#top" data-header-item aria-label="WAA Studio — inicio">
        <img class="logo-img" src="assets/waa-logo.png" alt="WAA Studio" />
      </a>

      <nav class="socials" aria-label="Redes sociales">
        <a
          href="https://www.instagram.com/wearewaaok/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          data-header-item
        >
          <!-- Relleno, no trazo: un contorno fino sobre negro se suaviza
               en los bordes y se lee gris. Relleno se ve blanco pleno,
               igual que el de Vimeo. -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.15-3.23 1.66-4.77 4.92-4.92C8.42 2.17 8.8 2.16 12 2.16zm0-2.16C8.74 0 8.33.01 7.05.07c-4.36.2-6.78 2.62-6.98 6.98C.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98 1.28.06 1.69.07 4.95.07s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 12 18.16 6.16 6.16 0 0 0 12 5.84zm0 10.16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z" />
          </svg>
        </a>
        <a
          href="https://vimeo.com/wearewaa"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Vimeo"
          data-header-item
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M22 7.3c-.1 2.1-1.6 5-4.4 8.6-2.9 3.8-5.4 5.7-7.4 5.7-1.3 0-2.3-1.2-3.2-3.5-.6-2.1-1.1-4.2-1.7-6.3-.6-2.3-1.3-3.5-2-3.5-.2 0-.7.3-1.6.9L.4 8c1-.9 2-1.7 3-2.6C4.7 4.2 5.7 3.6 6.4 3.5c1.6-.2 2.6.9 3 3.3.4 2.5.7 4.1.8 4.7.4 2 .9 3 1.4 3 .4 0 1-.6 1.8-1.9.8-1.3 1.2-2.2 1.3-2.9.1-1.1-.3-1.6-1.3-1.6-.5 0-1 .1-1.4.3 1-3.2 2.8-4.7 5.5-4.6 2 .1 2.9 1.3 2.8 3.5z" />
          </svg>
        </a>
      </nav>
    </header>

    <!-- Envoltorio del scroll.
         Abierta como pagina normal no hace nada: scrollea la ventana,
         como siempre. Embebida en un iframe (Wix) toma el alto del
         marco y pasa a scrollear ella, porque ahi el scroll del
         documento no es confiable: si el que se mueve es el marco de
         afuera, el catalogo no se entera y la barra lateral no se
         puede quedar fija. Lo maneja js/app.js con la clase is-embed. -->
    <div class="scroller">
      <!-- Barra de categoría sticky (solo mobile) -->
      <div class="mobile-cat" aria-hidden="true">
        <span class="mobile-cat-title"></span>
        <span class="mobile-cat-count"></span>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-inner">
            <!-- Titulo grande de la categoria activa -->
            <div class="sidebar-title-area">
              <h1 class="sidebar-title"></h1>
            </div>

            <!-- Listado chico: las cuatro, en gris, con la activa en blanco -->
            <nav class="category-nav" aria-label="Categorías">
              <ol class="category-list"></ol>
            </nav>
          </div>
        </aside>

        <main id="content">
          <div class="content" role="list"></div>
        </main>
      </div>
    </div>

    <!-- GSAP desde CDN, igual que Three.js en las otras páginas de WAA.
         Son scripts clásicos (sin type="module") a propósito: así la web
         funciona abriendo index.html con doble click, sin servidor. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <script src="data/categories.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
